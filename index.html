<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>To-Do List with a Done Sound</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>🌸 To-Do List 🌸</h1>

    <div class="todo-input">
      <input
        id="todo-input"
        type="text"
        placeholder="What do you need to do?"
      />
      <button id="add-btn">Add</button>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
